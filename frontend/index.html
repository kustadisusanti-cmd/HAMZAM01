<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>HAMZAM</title><link rel="manifest" href="/manifest.webmanifest"></head><body><main><h1>HAMZAM</h1><p>AI Trading Analysis</p><input id="s" value="BTCUSDT"><select id="h"><option>1h</option><option>4h</option><option>15m</option></select><select id="l"><option>15m</option><option>5m</option><option>1m</option></select><button onclick="go()">LIVE MARKET</button><pre id="o">Ready.</pre></main><script>async function go(){o.textContent='Loading...';try{let r=await fetch(`/analyze/binance?symbol=${s.value}&htf_interval=${h.value}&ltf_interval=${l.value}`);o.textContent=JSON.stringify(await r.json(),null,2)}catch(e){o.textContent=e}}</script></body></html>
